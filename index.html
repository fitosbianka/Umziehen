<title>Our Next Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f1e8; --panel:#fbf8f1; --card:#f3eee1; --ink:#2c2921; --muted:#7f7867; --faint:#a59d8a;
  --line:#e2dbc9; --line2:#d2c9b2;
  --map:#eee8d9; --water:#c5dae4; --watere:#9dbecd; --rail:#b7ad97;
  --bern:#2f7a4e; --zurich:#22679f; --basel:#a8463d;
  --her:#7d4f8c; --gold:#a07316; --wild:#bd6a1c; --heart:#b95e6c; --home:#857d69;
  --chipbg:#efe9d8; --shadow:0 10px 30px rgba(60,50,20,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181712; --panel:#201e17; --card:#272419; --ink:#ebe6d8; --muted:#a69d88; --faint:#7c7563;
    --line:#373327; --line2:#453f2f;
    --map:#1d1c15; --water:#233c4a; --watere:#3d637b; --rail:#5a5442;
    --bern:#63b287; --zurich:#649fd0; --basel:#d3806f;
    --her:#b78fc7; --gold:#d2a743; --wild:#dc924a; --heart:#da8f9a; --home:#a39a83;
    --chipbg:#2c2a1f; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#181712; --panel:#201e17; --card:#272419; --ink:#ebe6d8; --muted:#a69d88; --faint:#7c7563;
  --line:#373327; --line2:#453f2f;
  --map:#1d1c15; --water:#233c4a; --watere:#3d637b; --rail:#5a5442;
  --bern:#63b287; --zurich:#649fd0; --basel:#d3806f;
  --her:#b78fc7; --gold:#d2a743; --wild:#dc924a; --heart:#da8f9a; --home:#a39a83;
  --chipbg:#2c2a1f; --shadow:0 10px 30px rgba(0,0,0,.5);
}
html,body{height:100%;}
body{margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.55 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;}
*{box-sizing:border-box;}
#app{height:100%; display:flex; flex-direction:column;}

header{display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:12px 18px 10px; border-bottom:1px solid var(--line); background:var(--panel);}
.brand h1{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:21px; margin:0; letter-spacing:.2px;}
.brand p{margin:0; font-size:12.5px; color:var(--muted);}
nav{display:flex; gap:6px; margin-left:auto; overflow-x:auto; max-width:100%; padding-bottom:2px;}
nav button{border:1px solid var(--line2); background:var(--chipbg); color:var(--ink);
  font:600 13px/1 "IBM Plex Sans", sans-serif; padding:9px 14px; border-radius:999px;
  cursor:pointer; white-space:nowrap; transition:background .15s, color .15s;}
nav button:hover{border-color:var(--muted);}
nav button:focus-visible{outline:2px solid var(--her); outline-offset:2px;}
nav button.on{color:#fff; border-color:transparent;}
nav button.on[data-s="start"]{background:var(--ink); color:var(--bg);}
nav button.on[data-s="bern"]{background:var(--bern);}
nav button.on[data-s="zurich"]{background:var(--zurich);}
nav button.on[data-s="basel"]{background:var(--basel);}

main{flex:1; display:flex; min-height:0;}
#mapwrap{flex:1; position:relative; min-width:0; background:var(--map);}
#map{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab;}
#map.dragging{cursor:grabbing;}

.overlay{position:absolute; z-index:5; display:flex; gap:6px; align-items:center;}
#frames{top:10px; left:10px; flex-wrap:wrap; max-width:70%;}
#frames button, .zbtn{border:1px solid var(--line2); background:var(--panel); color:var(--muted);
  font:600 12px/1 "IBM Plex Sans", sans-serif; padding:7px 11px; border-radius:999px; cursor:pointer;}
#frames button.on{color:var(--ink); border-color:var(--muted);}
#frames button:focus-visible,.zbtn:focus-visible{outline:2px solid var(--her); outline-offset:2px;}
#zoombtns{top:10px; right:10px; flex-direction:column;}
.zbtn{width:34px; height:34px; padding:0; font-size:17px; color:var(--ink); border-radius:10px;}

#detail{position:absolute; z-index:6; left:12px; bottom:12px; width:min(360px, calc(100% - 24px));
  background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  padding:14px 16px 12px; display:none; max-height:min(56%, 340px); overflow:auto;}
#detail.open{display:block;}
#detail .close{position:absolute; top:8px; right:8px; border:0; background:none; color:var(--muted);
  font-size:17px; cursor:pointer; padding:4px 8px; border-radius:8px;}
#detail .close:hover{color:var(--ink);}
#detail h3{font-family:"Fraunces", Georgia, serif; font-size:18px; margin:0 0 2px; padding-right:26px;}
#detail .tag{color:var(--muted); font-size:13px; margin:0 0 10px;}
#detail .stats{display:flex; flex-direction:column; gap:5px; margin:0 0 10px;}
#detail .stat{display:flex; gap:8px; align-items:baseline; font-size:13.5px;}
#detail .stat b{font-variant-numeric:tabular-nums; white-space:nowrap;}
#detail .dot{width:9px; height:9px; border-radius:50%; flex:none; position:relative; top:0;}
#detail .why{font-size:13.5px; margin:0 0 8px;}
#detail .watch{font-size:13px; color:var(--muted); border-left:3px solid var(--wild); padding:2px 0 2px 10px; margin:0;}

aside{width:410px; flex:none; background:var(--panel); border-left:1px solid var(--line);
  overflow-y:auto; padding:20px 22px 26px;}
aside .verdict{font-family:"Fraunces", Georgia, serif; font-size:19px; font-weight:600; line-height:1.4;
  margin:0 0 6px; text-wrap:balance;}
aside .verdict em{font-style:normal;}
.s-bern aside .verdict em{color:var(--bern);} .s-zurich aside .verdict em{color:var(--zurich);}
.s-basel aside .verdict em{color:var(--basel);} .s-start aside .verdict em{color:var(--her);}
aside .lede{color:var(--muted); font-size:13.5px; margin:0 0 16px;}
aside h4{font:600 11.5px/1 "IBM Plex Sans", sans-serif; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); margin:22px 0 10px;}
aside h4:first-of-type{margin-top:14px;}

.chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px;}
.chip{background:var(--chipbg); border:1px solid var(--line); color:var(--ink); border-radius:999px;
  padding:5px 11px; font-size:12.5px;}
.chip b{font-weight:600;}

.givens{display:flex; flex-direction:column; gap:8px; padding:0; margin:0; list-style:none;}
.givens li{display:flex; gap:10px; font-size:13.5px; align-items:baseline;}
.givens .dot{width:10px; height:10px; border-radius:50%; flex:none; transform:translateY(1px);}

.cards{display:flex; flex-direction:column; gap:8px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px;
  cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit; transition:border-color .15s;}
.card:hover{border-color:var(--muted);}
.card:focus-visible{outline:2px solid var(--her); outline-offset:2px;}
.card.sel{border-color:var(--ink);}
.card .top{display:flex; align-items:center; gap:8px;}
.card .name{font-weight:600; font-size:14.5px;}
.badge{font:600 10.5px/1 "IBM Plex Sans", sans-serif; letter-spacing:.06em; text-transform:uppercase;
  border-radius:999px; padding:4px 8px;}
.badge.top{background:var(--gold); color:var(--bg);}
.badge.good{background:var(--chipbg); color:var(--muted); border:1px solid var(--line2);}
.badge.wild{background:none; color:var(--wild); border:1px dashed var(--wild);}
.card .tag{color:var(--muted); font-size:12.5px; margin:3px 0 7px;}
.card .mins{display:flex; flex-wrap:wrap; gap:5px 14px; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
.card .mins b{color:var(--ink); font-weight:600;}
.card .mins .sw{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}

.steps{margin:0; padding-left:21px; display:flex; flex-direction:column; gap:9px; font-size:13.5px;}
.steps li::marker{color:var(--faint); font-weight:600;}
.money{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:13.5px;}
.money p{margin:0 0 6px;} .money p:last-child{margin:0;}

table.cmp{width:100%; border-collapse:collapse; font-size:12.5px;}
table.cmp th{font:600 10.5px/1.3 "IBM Plex Sans", sans-serif; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); text-align:left; padding:4px 8px 6px 0;}
table.cmp td{border-top:1px solid var(--line); padding:7px 8px 7px 0; vertical-align:top;}
table.cmp td:first-child{font-weight:600;}
table.cmp .n{font-variant-numeric:tabular-nums; white-space:nowrap;}

.legend{display:grid; grid-template-columns:1fr 1fr; gap:7px 14px; font-size:12.5px; color:var(--muted);}
.legend div{display:flex; align-items:center; gap:8px;}
.legend svg{flex:none;}
.foot{color:var(--faint); font-size:12px; margin-top:22px; border-top:1px solid var(--line); padding-top:12px;}
.foot p{margin:0 0 6px;}

@media (max-width: 960px){
  main{flex-direction:column;}
  #mapwrap{flex:none; height:52vh; min-height:330px;}
  aside{width:auto; border-left:0; border-top:1px solid var(--line); flex:1;}
  #frames{max-width:calc(100% - 60px);}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

/* map svg */
#map .lake{fill:var(--water); stroke:var(--watere); stroke-width:1; vector-effect:non-scaling-stroke;}
#map .river{fill:none; stroke:var(--water); stroke-width:2.4; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round;}
#map .rail{fill:none; stroke:var(--rail); stroke-width:1.4; stroke-dasharray:7 4; vector-effect:non-scaling-stroke; stroke-linejoin:round; opacity:.75;}
#map .rail.minor{opacity:.45; stroke-dasharray:3 4;}
#map .rail.hot{stroke-width:2.6; stroke-dasharray:none; opacity:.95;}
#map text{font-family:"IBM Plex Sans", sans-serif; paint-order:stroke; stroke:var(--map); stroke-width:3px; fill:var(--muted);}
#map .mk.wl{cursor:default; pointer-events:none;}
#map .mk text.wlabel{fill:var(--watere); font-style:italic; stroke:none; font-size:10.5px; font-weight:500; letter-spacing:.04em;}
#map .ctx circle{fill:var(--faint);}
#map .ctx text{font-size:11px;}
#map .ctx.big text{font-size:13px; font-weight:600; fill:var(--ink);}
#map .ctx.big circle{fill:var(--ink);}
#map .mk{cursor:pointer;}
#map .mk text{font-size:11.5px; font-weight:600; fill:var(--ink);}
#map .mk .sub{font-size:9.5px; font-weight:500; fill:var(--muted);}
#map .lbl-off text{display:none;}
#map .mk .halo{fill:none; stroke:var(--ink); stroke-width:2; opacity:0; vector-effect:non-scaling-stroke;}
#map .mk.sel .halo{opacity:.9;}
#map .mk:hover .halo{opacity:.45;}
#map .clinic.dim{opacity:.28;}
#map .commute{fill:none; stroke-width:2.2; vector-effect:non-scaling-stroke; stroke-dasharray:2 5; stroke-linecap:round;}
#map .pill rect{fill:var(--panel); stroke:var(--line2);}
#map .pill text{font-size:10.5px; font-weight:600; stroke:none; fill:var(--ink);}
</style>

<div id="app" class="s-start">
  <header>
    <div class="brand">
      <h1>Our Next Home</h1>
      <p>Three cities can say yes to Noah. Here is where each yes could take us.</p>
    </div>
    <nav id="tabs" aria-label="Scenario">
      <button data-s="start" class="on">Start here</button>
      <button data-s="bern">If Bern says yes</button>
      <button data-s="zurich">If Zürich says yes</button>
      <button data-s="basel">If Basel says yes</button>
    </nav>
  </header>
  <main>
    <div id="mapwrap">
      <svg id="map" role="application" aria-label="Map of possible places to live"></svg>
      <div class="overlay" id="frames"></div>
      <div class="overlay" id="zoombtns">
        <button class="zbtn" id="zin" aria-label="Zoom in">+</button>
        <button class="zbtn" id="zout" aria-label="Zoom out">&minus;</button>
      </div>
      <div id="detail" role="dialog" aria-label="Place details">
        <button class="close" aria-label="Close">&times;</button>
        <div id="detailBody"></div>
      </div>
    </div>
    <aside id="panel"></aside>
  </main>
</div>

  lab = lab || {};

  const g = el("g",{class:"mk "+cls, transform:`translate(${x} ${y})`}, parent);
  const inner = el("g",{}, g); // counter scaled
  build(inner);
  if(labelText){
    const anchor = lab.anchor || "middle";
    const lx = lab.x!==undefined? lab.x : 0;
    const ly = lab.y!==undefined? lab.y : -14;
    const t = el("text",{x:lx, y:ly, "text-anchor":anchor}, inner);
    t.textContent = labelText;
    if(subText){
      const s = el("text",{x:lx, y:ly+12, "text-anchor":anchor, class:"sub"}, inner);
      s.textContent = subText;
    }
  }
  markers.push({g, inner, x, y, minZ: minZ||0});
  return g;
}

/* ---------- view state / camera ---------- */
let view = {x:0, y:0, w:100, h:100};
let anim = null;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function clientSize(){ const r = svg.getBoundingClientRect(); return [Math.max(r.width,1), Math.max(r.height,1)]; }
function applyView(){
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  const [cw,ch] = clientSize();
  const k = Math.max(view.w/cw, view.h/ch); // world units per screen px
  const z = 1/k;
  markers.forEach(m=>{
    m.inner.setAttribute("transform", `scale(${k.toFixed(4)})`);
    m.g.classList.toggle("lbl-off", z < m.minZ);
    m.g.style.display = (m.suppressed || (m.hideZ && z < m.hideZ)) ? "none" : "";
  });
  document.querySelectorAll("#g_commute .pill > g").forEach(p=>{
    p.setAttribute("transform", `scale(${k.toFixed(4)})`);
  });
}
function boundsRect(b){ // [latMin, lonMin, latMax, lonMax] -> world rect
  const [x1,y1] = P(b[2], b[1]); // top left
  const [x2,y2] = P(b[0], b[3]); // bottom right
  return {x:x1, y:y1, w:x2-x1, h:y2-y1};
}
function fitRect(r, pad){
  pad = pad===undefined? 0.1 : pad;
  const [cw,ch] = clientSize();
  let w = r.w*(1+pad*2), h = r.h*(1+pad*2);
  let cx = r.x + r.w/2, cy = r.y + r.h/2;
  const want = cw/ch;
  if(w/h < want) w = h*want; else h = w/want;
  return {x:cx-w/2, y:cy-h/2, w, h};
}
function setView(v, animate){
  if(anim) cancelAnimationFrame(anim.raf), anim = null;
  if(!animate || reduceMotion){ view = v; applyView(); return; }
  const from = {...view}, dur = 650, t0 = performance.now();
  const lw0 = Math.log(from.w), lw1 = Math.log(v.w);
  const c0 = [from.x+from.w/2, from.y+from.h/2], c1 = [v.x+v.w/2, v.y+v.h/2];
  function step(t){
    let u = Math.min(1,(t-t0)/dur); u = u<.5? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;
    const w = Math.exp(lw0+(lw1-lw0)*u), h = w*(v.h/v.w);
    const cx = c0[0]+(c1[0]-c0[0])*u, cy = c0[1]+(c1[1]-c0[1])*u;
    view = {x:cx-w/2, y:cy-h/2, w, h};
    applyView();
    if(u<1) anim = {raf:requestAnimationFrame(step)}; else anim = null;
  }
  anim = {raf:requestAnimationFrame(step)};
}
function flyBounds(b, pad){ setView(fitRect(boundsRect(b), pad), true); }

/* pan and zoom */
const pointers = new Map();
let dragStart = null;
svg.addEventListener("pointerdown", e=>{
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if(pointers.size===1) dragStart = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false};
  svg.classList.add("dragging");
});
svg.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = [...pointers.values()];
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  const [cw] = clientSize();
  const k = view.w/cw;
  if(pointers.size===1 && dragStart){
    const dx = e.clientX-dragStart.x, dy = e.clientY-dragStart.y;
    if(Math.abs(dx)+Math.abs(dy)>3) dragStart.moved = true;
    if(anim) cancelAnimationFrame(anim.raf), anim=null;
    view.x = dragStart.vx - dx*k; view.y = dragStart.vy - dy*k;
    applyView();
  } else if(pointers.size===2){
    const cur = [...pointers.values()];
    const d0 = Math.hypot(prev[0][0]-prev[1][0], prev[0][1]-prev[1][1]);
    const d1 = Math.hypot(cur[0][0]-cur[1][0], cur[0][1]-cur[1][1]);
    if(d0>0 && d1>0) zoomAt((cur[0][0]+cur[1][0])/2, (cur[0][1]+cur[1][1])/2, d1/d0);
    dragStart = null;
  }
});
let justDragged = false;
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size===0){
    svg.classList.remove("dragging");
    justDragged = !!(dragStart && dragStart.moved);
    dragStart = null;
  }
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
svg.addEventListener("click", e=>{
  if(justDragged){ justDragged = false; return; }
  if(e.target === svg || e.target.closest("#g_water, #g_rails, #g_ctx")) clearSel();
});
svg.addEventListener("wheel", e=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.pow(2, -e.deltaY/480));
},{passive:false});
svg.addEventListener("dblclick", e=>{ zoomAt(e.clientX, e.clientY, 1.7); });
function zoomAt(cx, cy, f){
  if(anim) cancelAnimationFrame(anim.raf), anim=null;
  const r = svg.getBoundingClientRect();
  const px = (cx-r.left)/r.width, py = (cy-r.top)/r.height;
  const wx = view.x+view.w*px, wy = view.y+view.h*py;
  let w = view.w/f;
  w = Math.min(Math.max(w, 14), 2600);
  const h = w*(view.h/view.w);
  view = {x:wx-w*px, y:wy-h*py, w, h};
  applyView();
}
document.getElementById("zin").onclick = ()=>{ const r=svg.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1.5); };
document.getElementById("zout").onclick = ()=>{ const r=svg.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.5); };
new ResizeObserver(()=>applyView()).observe(svg);

function swColor(kind){ return kind==="her"? "var(--her)" : ACC[SC]; }
function fmtMin(m){ return m>=60? Math.floor(m/60)+"h"+String(m%60).padStart(2,"0") : m+" min"; }

function clearSel(){
  selected = null;

  document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel"));
}

function commuteLine(from, to, kind, label){
  const [x1,y1] = P(from.lat, from.lon), [x2,y2] = P(to.lat, to.lon);
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy)||1;
  if(len < 12) return; // next door: a line and pill would only cover the map
  const mx = (x1+x2)/2 - dy/len*len*0.14, my = (y1+y2)/2 + dx/len*len*0.14;
  el("path",{d:`M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`, class:"commute", stroke:swColor(kind)}, layers.commute);
  const lx = 0.25*x1+0.5*mx+0.25*x2, ly = 0.25*y1+0.5*my+0.25*y2;
  const holder = el("g",{class:"pill", transform:`translate(${lx} ${ly})`}, layers.commute);
  const inner = el("g",{}, holder);
  const t = el("text",{x:0, y:3.5, "text-anchor":"middle"}, inner);
  t.textContent = label;
  const wpx = t.getComputedTextLength() + 16;
  el("rect",{x:-wpx/2, y:-9, width:wpx, height:19, rx:9.5, stroke:swColor(kind)}, inner);
  inner.appendChild(t); // move text above rect
  applyView();
}
function select(cand, fly){
  clearSel();
  selected = cand.id;
  candEls[cand.id] && candEls[cand.id].classList.add("sel");
  const card = document.querySelector(`.card[data-id="${cand.id}"]`);
  if(card){ card.classList.add("sel"); }
  const work = FIXED[0], clinic = CLINICS[SC==="start"? "bern" : SC];
  commuteLine(cand, work, "her", "You "+fmtMin(cand.her));
  if(SC!=="start") commuteLine(cand, clinic, "him", "Noah "+fmtMin(cand.him));
  detailBody.innerHTML = `
    <h3>${cand.name}</h3>
    <p class="tag">${cand.tag}</p>
    <div class="stats">
      <div class="stat"><span class="dot" style="background:var(--her)"></span><span><b>${fmtMin(cand.her)}</b> you, door to door to Kehrsatz</span></div>
      ${SC!=="start"? `<div class="stat"><span class="dot" style="background:${ACC[SC]}"></span><span><b>${fmtMin(cand.him)}</b> Noah, door to door to the clinic</span></div>`:""}
      <div class="stat"><span class="dot" style="background:var(--faint)"></span><span><b>CHF ${cand.r35}</b> for 3.5 rooms, <b>${cand.r45}</b> for 4.5</span></div>
    </div>
    <p class="why">${cand.why}</p>
    <p class="watch">${cand.watch}</p>`;
  detail.classList.add("open");
  if(fly){
    const pts = [[cand.lat,cand.lon],[clinic.lat,clinic.lon]];
    const dKm = Math.hypot(...P(cand.lat,cand.lon).map((v,i)=>v-P(clinic.lat,clinic.lon)[i]));
    if(dKm > 130) pts.push([work.lat,work.lon]);
    const lats = pts.map(p=>p[0]), lons = pts.map(p=>p[1]);
    flyBounds([Math.min(...lats), Math.min(...lons), Math.max(...lats), Math.max(...lons)], 0.22);
  }
}
function badgeName(b){ return b==="top"? "Top pick" : b==="wild"? "Wildcard" : "Good option"; }

const LABEL_BELOW = {kehrsatz:1, wabern2:1, wollishofen:1};
function renderCands(){
  layers.cands.replaceChildren();
  for(let i=markers.length-1;i>=0;i--){ if(markers[i].cand) markers.splice(i,1); }
  candEls = {};
  if(SC==="start") return;
  CANDS[SC].forEach(c=>{
    const g = marker(layers.cands, c.lat, c.lon, "cand", 0.5,
      p=>{ el("circle",{r:12, fill:"transparent"}, p);
           if(c.badge==="top") glyph.star(p, "var(--gold)");
           else if(c.badge==="wild") glyph.wild(p);
           else glyph.dot(p);
           el("circle",{r:11, class:"halo"}, p); },
      c.name, null, LABEL_BELOW[c.id]? {y:24} : undefined);
    g.setAttribute("role","button"); g.setAttribute("tabindex","0");
    g.setAttribute("aria-label", c.name);
    markers[markers.length-1].cand = true;
    g.addEventListener("click", e=>{ e.stopPropagation(); select(c, false); });
    g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(c, false); } });
    candEls[c.id] = g;
  });
  // hide context dots that sit under candidates
  markers.forEach(m=>{
    if(!m.ctxName) return;
    m.suppressed = CANDS[SC].some(c=>{ const [x,y]=P(c.lat,c.lon); return Math.hypot(x-m.x,y-m.y) < 6; });
  });
}
function renderFrames(){
  framesBox.replaceChildren();
  FRAMES[SC].forEach(([name,b],i)=>{
    const btn = document.createElement("button");
    btn.textContent = name;
    if(i===0) btn.classList.add("on");
    btn.onclick = ()=>{ framesBox.querySelectorAll("button").forEach(x=>x.classList.remove("on")); btn.classList.add("on"); flyBounds(b); };
    framesBox.appendChild(btn);
  });
}
function renderRails(){
  for(const k in railEls){ railEls[k].classList.remove("hot"); railEls[k].style.stroke = ""; }
  CORRIDORS[SC].forEach(k=>{ railEls[k].classList.add("hot"); railEls[k].style.stroke = ACC[SC]; });
}
function renderClinics(){

function renderPanel(){

  });

}
function setScenario(s, animate){
  SC = s;
  app.className = "s-"+s;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.s===s));
  clearSel();
  renderRails(); renderClinics(); renderCands(); renderFrames(); renderPanel();
  flyBoundsInit(animate);
  try{ localStorage.setItem("scenario", s); }catch(e){}
}
function flyBoundsInit(animate){
  const b = FRAMES[SC][0][1];
  if(animate) flyBounds(b); else setView(fitRect(boundsRect(b)), false);
}
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click", ()=>setScenario(b.dataset.s, true));
});

/* boot */
let start = "start";
